<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      font-family: Arial, sans-serif;
      padding: 12px;
      margin: 0;
      background-color: #202124;
      color: #e8eaed;
    }
    h3 {
      margin-top: 0;
      font-size: 14px;
      color: #8ab4f8;
      text-align: center;
    }
    .flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    input[type="number"] {
      width: 55px;
      padding: 4px;
      border: 1px solid #5f6368;
      border-radius: 4px;
      background: #303134;
      color: #fff;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 6px;
      background-color: #8ab4f8;
      color: #202124;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #aecbfa;
    }
    .status {
      font-size: 11px;
      color: #9aa0a6;
      text-align: center;
      margin-top: 6px;
      height: 14px;
    }
  </style>
</head>
<body>
  <h3>Google AI Cleaner</h3>
  <div class="flex">
    <span>Лимит сообщений:</span>
    <input type="number" id="maxMessages" min="1" max="100" value="12">
  </div>
  <button id="saveBtn">Сохранить</button>
  <div class="status" id="statusText"></div>

  <script src="popup.js"></script>
</body>
</html>
